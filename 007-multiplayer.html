<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>007 — MULTIPLAYER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --border: #2a2a3a;
    --gold: #f5c518;
    --gold2: #8b6e00;
    --red: #e63946;
    --red2: #8b1c24;
    --green: #2dc653;
    --green2: #166b2b;
    --blue: #4cc9f0;
    --blue2: #1a6d8a;
    --white: #eaeaea;
    --gray: #555570;
    --purple: #b57bee;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:var(--bg);
    font-family:'Press Start 2P', monospace;
    color:var(--white);
    overflow:hidden;
    touch-action:manipulation;
  }

  body::before {
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
    pointer-events:none; z-index:9999;
  }

  /* ── SCREENS ── */
  .screen {
    display:none; position:fixed; inset:0;
    flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px,3vh,22px); padding:20px; overflow-y:auto;
  }
  .screen.active { display:flex; }

  /* ── BUTTONS ── */
  .px-btn {
    font-family:'Press Start 2P',monospace; font-size:clamp(10px,1.8vw,14px);
    padding:12px 16px; background:var(--panel); color:var(--gold);
    border:3px solid var(--gold); cursor:pointer; letter-spacing:1px;
    transition:all 0.08s; box-shadow:3px 3px 0 var(--gold2);
    width:100%; text-align:center; -webkit-tap-highlight-color:transparent;
  }
  .px-btn:hover,.px-btn:active { background:var(--gold); color:var(--bg); transform:translate(-1px,-1px); }
  .px-btn.gray  { color:var(--gray); border-color:var(--gray); box-shadow:3px 3px 0 #333; }
  .px-btn.gray:hover  { background:var(--gray); color:var(--bg); }
  .px-btn.red   { color:var(--red); border-color:var(--red); box-shadow:3px 3px 0 var(--red2); }
  .px-btn.red:hover   { background:var(--red); color:#fff; }
  .px-btn.green { color:var(--green); border-color:var(--green); box-shadow:3px 3px 0 var(--green2); }
  .px-btn.green:hover { background:var(--green); color:#fff; }
  .px-btn.blue  { color:var(--blue); border-color:var(--blue); box-shadow:3px 3px 0 var(--blue2); }
  .px-btn.blue:hover  { background:var(--blue); color:#fff; }
  .px-btn:disabled { opacity:0.3; cursor:not-allowed; transform:none !important; }
  .px-btn.sm { font-size:clamp(8px,1.4vw,11px); padding:8px 10px; }

  /* ── LOBBY ── */
  .lobby-title {
    font-size:clamp(28px,7vw,60px); color:var(--gold);
    text-shadow:0 0 10px var(--gold); letter-spacing:8px;
    animation:flicker 5s infinite;
  }
  @keyframes flicker { 0%,93%,100%{opacity:1} 94%{opacity:0.6} 96%{opacity:1} 98%{opacity:0.4} }

  .lobby-sub { font-size:clamp(9px,1.5vw,12px); color:var(--gray); letter-spacing:3px; }

  .lobby-card {
    width:100%; max-width:320px;
    background:var(--panel); border:3px solid var(--border);
    padding:16px; display:flex; flex-direction:column; gap:12px;
    box-shadow:4px 4px 0 var(--border);
  }
  .lobby-card-title { font-size:clamp(10px,1.8vw,13px); color:var(--gold); letter-spacing:2px; }

  .lobby-input {
    font-family:'Press Start 2P',monospace; font-size:clamp(10px,1.8vw,13px);
    background:var(--bg); border:2px solid var(--border);
    color:var(--white); padding:10px; width:100%; outline:none;
    letter-spacing:2px; text-transform:uppercase;
  }
  .lobby-input:focus { border-color:var(--gold); }
  .lobby-input.code-input {
    font-size:clamp(18px,4vw,28px); text-align:center; letter-spacing:8px;
    color:var(--gold);
  }

  .lobby-divider {
    display:flex; align-items:center; gap:8px; width:100%; max-width:320px;
  }
  .lobby-divider::before,.lobby-divider::after {
    content:''; flex:1; height:2px; background:var(--border);
  }
  .lobby-divider span { font-size:9px; color:var(--gray); }

  /* ── WAITING ROOM ── */
  .waiting-title { font-size:clamp(12px,2.5vw,18px); color:var(--gold); letter-spacing:3px; }
  .room-code-display {
    font-size:clamp(28px,7vw,52px); color:var(--gold);
    text-shadow:0 0 15px var(--gold),0 0 40px rgba(245,197,24,0.3);
    letter-spacing:12px; animation:pulse 1.5s ease-in-out infinite alternate;
    background:var(--panel); border:3px solid var(--gold);
    padding:14px 22px; text-align:center;
  }
  @keyframes pulse { 0%{text-shadow:0 0 8px var(--gold)} 100%{text-shadow:0 0 22px var(--gold),0 0 50px rgba(245,197,24,0.4)} }

  .waiting-msg { font-size:clamp(8px,1.4vw,11px); color:var(--gray); text-align:center; line-height:2.2; }
  .waiting-dot { display:inline-block; animation:blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .players-list { width:100%; max-width:320px; display:flex; flex-direction:column; gap:6px; }
  .player-slot {
    background:var(--panel); border:2px solid var(--border);
    padding:10px 12px; display:flex; align-items:center; gap:8px;
    font-size:clamp(8px,1.4vw,11px);
  }
  .player-slot.connected { border-color:var(--green); }
  .player-slot.waiting   { border-color:var(--gray); opacity:0.5; }
  .player-slot .slot-icon { font-size:18px; }
  .player-slot .slot-name { color:var(--white); flex:1; }
  .player-slot .slot-status { font-size:8px; color:var(--green); }
  .player-slot.waiting .slot-status { color:var(--gray); }

  /* ── GAME SCREEN ── */
  #screen-game { justify-content:space-between; padding:6px 10px; gap:4px; }

  .top-bar {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; font-size:clamp(8px,1.5vw,11px); color:var(--gray); flex-shrink:0;
  }

  .arena {
    display:grid; grid-template-columns:1fr auto 1fr; gap:6px;
    width:100%; flex-shrink:0;
  }
  .fighter-card {
    background:var(--panel); border:2px solid var(--border);
    padding:clamp(6px,1.5vw,12px);
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(2px,1vh,5px);
  }
  .fighter-card.my-card     { border-color:var(--blue); }
  .fighter-card.enemy-card  { border-color:var(--red); }

  .fighter-name {
    font-size:clamp(7px,1.2vw,10px); letter-spacing:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .my-card    .fighter-name { color:var(--blue); }
  .enemy-card .fighter-name { color:var(--red); }

  .fighter-sprite { font-size:clamp(34px,6.5vw,58px); line-height:1; }
  .fighter-sprite.hit    { animation:hit-flash 0.4s; }
  .fighter-sprite.attack { animation:atk 0.35s; }
  @keyframes hit-flash { 0%,100%{filter:none} 50%{filter:brightness(4) saturate(0)} }
  @keyframes atk { 0%,100%{transform:translateX(0)} 35%{transform:translateX(14px)} }
  .enemy-card .fighter-sprite { transform:scaleX(-1); }
  .enemy-card .fighter-sprite.attack { animation:atk-e 0.35s; }
  @keyframes atk-e { 0%,100%{transform:scaleX(-1)} 35%{transform:scaleX(-1) translateX(14px)} }

  .hearts { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; }
  .heart  { font-size:clamp(11px,2vw,16px); }
  .heart.lost { filter:grayscale(1); opacity:0.22; }

  .bullets-bar { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; min-height:12px; }
  .bullet-pip { width:6px; height:13px; background:var(--gold); clip-path:polygon(50% 0%,100% 20%,100% 100%,0% 100%,0% 20%); }
  .bullet-pip.empty { background:var(--gray); opacity:0.22; }

  .status-badge {
    font-size:clamp(7px,1.1vw,9px); padding:3px 5px;
    background:var(--border); color:var(--gray);
    text-align:center; white-space:nowrap;
  }
  .status-badge.chosen  { background:#0a2a1a; color:var(--green); }
  .status-badge.waiting { background:#1a1a0a; color:var(--gold); }

  .vs-area {
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; padding-top:16px;
  }
  .vs-txt { font-size:clamp(14px,3vw,22px); color:var(--gold); text-shadow:0 0 6px var(--gold); }

  .result-banner {
    font-size:clamp(8px,1.4vw,11px); text-align:center; padding:7px 9px;
    border:2px solid var(--gold); background:var(--panel); width:100%;
    color:var(--white); letter-spacing:1px; line-height:1.9; flex-shrink:0;
    min-height:clamp(34px,8vh,52px); display:flex; align-items:center; justify-content:center;
  }

  /* Action buttons */
  .action-area { display:flex; flex-direction:column; gap:5px; width:100%; align-items:center; flex-shrink:0; }
  .action-row  { display:flex; gap:7px; justify-content:center; width:100%; }

  .action-btn {
    font-family:'Press Start 2P',monospace; font-size:clamp(8px,1.3vw,11px);
    padding:clamp(7px,1.8vh,11px) clamp(8px,1.8vw,16px);
    background:var(--panel); border:2px solid var(--border); color:var(--white);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:all 0.08s; flex:1; max-width:110px; box-shadow:2px 2px 0 var(--border);
    -webkit-tap-highlight-color:transparent;
  }
  .action-btn .icon { font-size:clamp(22px,4.5vw,32px); }
  .action-btn:hover:not(:disabled),.action-btn:active:not(:disabled) { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--border); }
  .action-btn:disabled { opacity:0.22; cursor:not-allowed; }
  .action-btn.shoot  { border-color:var(--red);   color:var(--red);   box-shadow:2px 2px 0 var(--red2); }
  .action-btn.reload { border-color:var(--gold);  color:var(--gold);  box-shadow:2px 2px 0 var(--gold2); }
  .action-btn.defend { border-color:var(--green); color:var(--green); box-shadow:2px 2px 0 var(--green2); }
  .action-btn.shoot:hover:not(:disabled)  { background:#2a0a0a; }
  .action-btn.reload:hover:not(:disabled) { background:#1a1500; }
  .action-btn.defend:hover:not(:disabled) { background:#0a1a0a; }
  .action-btn.chosen { opacity:0.5; border-style:dashed; }

  .round-info { font-size:clamp(7px,1.2vw,10px); color:var(--gray); text-align:center; line-height:1.9; white-space:pre-line; }

  /* ── GAME OVER ── */
  #screen-gameover { gap:clamp(10px,3vh,20px); }
  .go-title { font-size:clamp(24px,6vw,58px); animation:blink2 1s step-end infinite; }
  .go-title.win  { color:var(--gold); }
  .go-title.lose { color:var(--red); }
  .go-title.draw { color:var(--blue); }
  @keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:0} }
  .go-emoji { font-size:clamp(50px,10vw,90px); }
  .go-stats { font-size:clamp(8px,1.4vw,11px); color:var(--gray); text-align:center; line-height:2.4; white-space:pre-line; }
  .go-btns  { display:flex; flex-direction:column; gap:9px; width:100%; max-width:240px; }

  /* ── NOTIF ── */
  .notif {
    position:fixed; top:14px; left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:var(--panel); border:2px solid var(--gold); color:var(--gold);
    font-family:'Press Start 2P',monospace; font-size:clamp(10px,1.8vw,12px);
    padding:9px 14px; z-index:1000; transition:transform 0.25s;
    text-align:center; max-width:min(290px,90vw); pointer-events:none;
  }
  .notif.show  { transform:translateX(-50%) translateY(0); }
  .notif.red   { border-color:var(--red);   color:var(--red); }
  .notif.green { border-color:var(--green); color:var(--green); }
  .notif.blue  { border-color:var(--blue);  color:var(--blue); }
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<!-- ═══ LOBBY ═══ -->
<div class="screen active" id="screen-lobby">
  <div class="lobby-title">007</div>
  <div class="lobby-sub">⚔️ MULTIPLAYER</div>

  <!-- Criar sala -->
  <div class="lobby-card">
    <div class="lobby-card-title">🎮 CRIAR SALA</div>
    <input class="lobby-input" id="createName" placeholder="O TEU NOME" maxlength="12">
    <button class="px-btn green" onclick="createRoom()">▶ CRIAR SALA</button>
  </div>

  <div class="lobby-divider"><span>OU</span></div>

  <!-- Entrar em sala -->
  <div class="lobby-card">
    <div class="lobby-card-title">🔗 ENTRAR EM SALA</div>
    <input class="lobby-input" id="joinName" placeholder="O TEU NOME" maxlength="12">
    <input class="lobby-input code-input" id="joinCode" placeholder="CÓDIGO" maxlength="6">
    <button class="px-btn blue" onclick="joinRoom()">→ ENTRAR</button>
  </div>

  <button class="px-btn gray sm" onclick="goToMainGame()" style="max-width:240px">← VOLTAR AO JOGO</button>
</div>

<!-- ═══ WAITING ROOM ═══ -->
<div class="screen" id="screen-waiting">
  <div class="waiting-title">🔗 SALA CRIADA</div>
  <div style="font-size:clamp(8px,1.4vw,11px);color:var(--gray)">PARTILHA ESTE CÓDIGO:</div>
  <div class="room-code-display" id="roomCodeDisplay">——</div>
  <div class="players-list" id="playersList"></div>
  <div class="waiting-msg" id="waitingMsg">A aguardar adversário<span class="waiting-dot">...</span></div>
  <button class="px-btn gray sm" onclick="leaveRoom()" style="max-width:200px">✕ CANCELAR</button>
</div>

<!-- ═══ GAME ═══ -->
<div class="screen" id="screen-game">
  <div class="top-bar">
    <div style="color:var(--blue)">TU</div>
    <div>RONDA <span id="hud-round" style="color:var(--white)">1</span></div>
    <div style="color:var(--red)">INIMIGO</div>
  </div>

  <div class="arena">
    <div class="fighter-card my-card">
      <div class="fighter-name" id="myName">🕴🏼 TU</div>
      <div class="fighter-sprite" id="mySprite">🕴🏼</div>
      <div class="hearts" id="myHearts"></div>
      <div class="bullets-bar" id="myBullets"></div>
      <div class="status-badge" id="myStatus">— AGUARDA —</div>
    </div>

    <div class="vs-area">
      <div class="vs-txt">VS</div>
    </div>

    <div class="fighter-card enemy-card">
      <div class="fighter-name" id="enemyName">👤 INIMIGO</div>
      <div class="fighter-sprite" id="enemySprite">🕴🏻</div>
      <div class="hearts" id="enemyHearts"></div>
      <div class="bullets-bar" id="enemyBullets"></div>
      <div class="status-badge" id="enemyStatus">— AGUARDA —</div>
    </div>
  </div>

  <div class="result-banner" id="resultBanner">⚔️ Jogo a começar!</div>

  <div class="action-area">
    <div class="action-row">
      <button class="action-btn reload" id="btn-reload" onclick="sendAction('reload')">
        <span class="icon">🔄</span><span>RECARREGAR</span>
      </button>
      <button class="action-btn defend" id="btn-defend" onclick="sendAction('defend')">
        <span class="icon">🛡️</span><span>DEFENDER</span>
      </button>
      <button class="action-btn shoot" id="btn-shoot" onclick="sendAction('shoot')">
        <span class="icon">🔫</span><span>DISPARAR</span>
      </button>
    </div>
    <div class="round-info" id="roundInfo">Escolhe a tua ação!</div>
  </div>

  <div style="display:flex;gap:8px;width:100%;justify-content:center;flex-shrink:0">
    <button class="px-btn gray sm" onclick="confirmLeave()" style="flex:1;max-width:150px">✕ DESISTIR</button>
  </div>
</div>

<!-- ═══ GAME OVER ═══ -->
<div class="screen" id="screen-gameover">
  <div class="go-title" id="goTitle">FIM</div>
  <div class="go-emoji" id="goEmoji">🏆</div>
  <div class="go-stats" id="goStats"></div>
  <div class="go-btns">
    <button class="px-btn green" id="rematchBtn" onclick="requestRematch()">🔄 REVANCHE</button>
    <button class="px-btn gray" onclick="leaveRoom()">🏠 SAIR</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// ⚠️  CONFIGURAÇÃO — muda esta linha após o deploy!
// ══════════════════════════════════════════════════════
// Após fazer "npx partykit deploy", substitui pelo teu URL real:
// const PARTYKIT_HOST = "007-retro-pixel.O-TEU-USER.partykit.dev";
const PARTYKIT_HOST = "007-retro-pixel.fleekbreeze.partykit.dev";

// ══════════════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════════════
let ws = null;
let myId = null;
let myName = "";
let roomCode = "";
let isHost = false;
let chosenAction = null;
let waitingForOpponent = false;
let rematchRequested = false;

// Estado local do jogo (sincronizado pelo servidor)
let myHP = 5, myMaxHP = 5, myBullets = 0, myMaxBullets = 3;
let enemyHP = 5, enemyMaxHP = 5, enemyBullets = 0, enemyMaxBullets = 3;
let currentRound = 1;
let enemyNameStr = "INIMIGO";

// ══════════════════════════════════════════════════════
// GERADOR DE CÓDIGO ALEATÓRIO
// ══════════════════════════════════════════════════════
function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// ══════════════════════════════════════════════════════
// LOBBY
// ══════════════════════════════════════════════════════
function createRoom() {
  const name = document.getElementById("createName").value.trim().toUpperCase() || "AGENTE";
  myName = name;
  roomCode = genCode();
  connectWS(roomCode, name);
}

function joinRoom() {
  const name = document.getElementById("joinName").value.trim().toUpperCase() || "AGENTE";
  const code = document.getElementById("joinCode").value.trim().toUpperCase();
  if (!code || code.length < 4) { showNotif("Introduz um código válido!", "red"); return; }
  myName = name;
  roomCode = code;
  connectWS(code, name);
}

function goToMainGame() {
  // Abre o jogo principal numa nova tab
  window.open("007_casino.html", "_blank");
}

// ══════════════════════════════════════════════════════
// WEBSOCKET — ligação ao servidor PartyKit
// ══════════════════════════════════════════════════════
function connectWS(code, name) {
  const url = `wss://${PARTYKIT_HOST}/party/${code.toLowerCase()}`;
  showNotif("A ligar...", "blue");

  ws = new WebSocket(url);

  ws.onopen = () => {
    // Enviar info do jogador ao servidor
    ws.send(JSON.stringify({
      type: "join",
      name,
      hp: 5,
      maxBullets: 3,
    }));
  };

  ws.onmessage = (evt) => handleMessage(JSON.parse(evt.data));

  ws.onerror = () => showNotif("Erro de ligação! Verifica o código.", "red");

  ws.onclose = () => {
    if (document.getElementById("screen-game").classList.contains("active") ||
        document.getElementById("screen-waiting").classList.contains("active")) {
      showNotif("Ligação perdida!", "red");
    }
  };
}

// ══════════════════════════════════════════════════════
// MENSAGENS DO SERVIDOR
// ══════════════════════════════════════════════════════
function handleMessage(msg) {
  switch (msg.type) {

    case "error":
      showNotif(msg.msg, "red");
      break;

    case "connected":
      myId = msg.playerId;
      isHost = msg.isHost;
      // Mostrar sala de espera
      document.getElementById("roomCodeDisplay").textContent = roomCode;
      renderWaitingPlayers(msg.playerCount);
      showScreen("screen-waiting");
      if (!isHost) {
        document.getElementById("waitingMsg").innerHTML = "Ligado! A aguardar o host iniciar<span class='waiting-dot'>...</span>";
      }
      showNotif(isHost ? "Sala criada! Aguarda o teu amigo." : "Entraste na sala!", "green");
      break;

    case "playerJoined":
      renderWaitingPlayers(msg.playerCount);
      if (msg.playerCount === 2) {
        document.getElementById("waitingMsg").textContent = "2 jogadores! A iniciar...";
      }
      break;

    case "playerLeft":
      renderWaitingPlayers(msg.count);
      document.getElementById("waitingMsg").innerHTML = "A aguardar adversário<span class='waiting-dot'>...</span>";
      break;

    case "playerUpdate":
      // Atualizar nomes se necessário
      for (const [id, p] of Object.entries(msg.players)) {
        if (id !== myId) enemyNameStr = p.name;
      }
      break;

    case "gameStart":
      startLocalGame(msg.players, msg.rematch || false);
      break;

    case "actionConfirmed":
      // A minha ação foi confirmada pelo servidor
      chosenAction = msg.action;
      waitingForOpponent = true;
      document.getElementById("myStatus").textContent = "✅ ESCOLHEU";
      document.getElementById("myStatus").className = "status-badge chosen";
      document.getElementById("resultBanner").textContent = "⏳ A aguardar adversário...";
      disableActionBtns();
      break;

    case "playerReady":
      // Adversário já escolheu
      if (msg.playerId !== myId) {
        document.getElementById("enemyStatus").textContent = "✅ ESCOLHEU";
        document.getElementById("enemyStatus").className = "status-badge chosen";
      }
      break;

    case "roundResult":
      resolveLocalRound(msg);
      break;

    case "opponentLeft":
      showNotif(msg.msg, "green");
      showEndGame("win", "W.O.", currentRound - 1);
      break;

    case "rematchRequested":
      if (msg.playerId !== myId) {
        showNotif("Adversário quer revanche!", "blue");
        document.getElementById("rematchBtn").textContent = "✅ ACEITAR";
        document.getElementById("rematchBtn").onclick = acceptRematch;
      }
      break;
  }
}

// ══════════════════════════════════════════════════════
// INICIAR JOGO LOCAL (com dados do servidor)
// ══════════════════════════════════════════════════════
function startLocalGame(players, isRematch) {
  // Identificar o meu player e o inimigo
  for (const [id, p] of Object.entries(players)) {
    if (id === myId) {
      myHP = p.hp; myMaxHP = p.maxHp;
      myBullets = p.bullets; myMaxBullets = p.maxBullets;
    } else {
      enemyHP = p.hp; enemyMaxHP = p.maxHp;
      enemyBullets = p.bullets; enemyMaxBullets = p.maxBullets;
      enemyNameStr = p.name;
    }
  }
  currentRound = 1;
  chosenAction = null;
  waitingForOpponent = false;
  rematchRequested = false;

  // Atualizar UI
  document.getElementById("myName").textContent = "🕴🏼 " + myName;
  document.getElementById("enemyName").textContent = "🕴🏻 " + enemyNameStr;
  document.getElementById("mySprite").textContent = "🕴🏼";
  document.getElementById("enemySprite").textContent = "🕴🏻";

  showScreen("screen-game");
  updateHUD();
  setResultBanner(isRematch ? "🔄 Revanche! Boa sorte!" : "⚔️ Que comecem os duelos!");
  updateActionBtns();

  if (isRematch) showNotif("Revanche iniciada!", "green");
}

// ══════════════════════════════════════════════════════
// AÇÃO DO JOGADOR
// ══════════════════════════════════════════════════════
function sendAction(action) {
  if (chosenAction !== null || !ws) return;

  // Validações locais
  if (action === "shoot" && myBullets === 0) { showNotif("Sem balas!", "red"); return; }
  if (action === "reload" && myBullets >= myMaxBullets) { showNotif("Arma cheia!", "red"); return; }
  if (action === "shoot" && currentRound === 1) { showNotif("Não podes disparar na Ronda 1!", "red"); return; }

  ws.send(JSON.stringify({ type: "action", action }));
}

// ══════════════════════════════════════════════════════
// RESOLVER RONDA (com dados do servidor)
// ══════════════════════════════════════════════════════
function resolveLocalRound(msg) {
  waitingForOpponent = false;
  chosenAction = null;

  // Atualizar estado local com dados do servidor
  for (const [id, p] of Object.entries(msg.players)) {
    if (id === myId) {
      myHP = p.hp; myMaxHP = p.maxHp; myBullets = p.bullets;
    } else {
      enemyHP = p.hp; enemyMaxHP = p.maxHp; enemyBullets = p.bullets;
    }
  }
  currentRound = msg.round + 1;

  // Animações
  const myAct = msg.actions[myId];
  const pSpr = document.getElementById("mySprite");
  const eSpr = document.getElementById("enemySprite");
  if (myAct === "shoot") pSpr.classList.add("attack");
  else if (msg.result.includes("Foste atingido") || msg.result.includes("Perdeste 1 vida")) pSpr.classList.add("hit");
  if (msg.result.includes("Acertaste") || msg.result.includes("ACERTO")) { setTimeout(() => eSpr.classList.add("hit"), 180); }
  setTimeout(() => { pSpr.classList.remove("hit","attack"); eSpr.classList.remove("hit","attack"); }, 600);

  // Mostrar resultado
  setResultBanner(msg.result);
  updateHUD();
  document.getElementById("hud-round").textContent = msg.round;

  // Status badges
  document.getElementById("myStatus").textContent = "— AGUARDA —";
  document.getElementById("myStatus").className = "status-badge";
  document.getElementById("enemyStatus").textContent = "— AGUARDA —";
  document.getElementById("enemyStatus").className = "status-badge";

  setTimeout(() => {
    if (msg.outcome === "aWins" || msg.outcome === "bWins" || msg.outcome === "draw") {
      const iWon = (msg.outcome === "aWins" && msg.myId === myId) ||
                   (msg.outcome === "bWins" && msg.myId !== myId);
      const isDraw = msg.outcome === "draw";
      showEndGame(isDraw ? "draw" : iWon ? "win" : "lose", enemyNameStr, msg.round);
    } else {
      updateActionBtns();
    }
  }, 1200);
}

// ══════════════════════════════════════════════════════
// FIM DE JOGO
// ══════════════════════════════════════════════════════
function showEndGame(outcome, opponentName, finalRound) {
  const titleEl = document.getElementById("goTitle");
  const emojiEl = document.getElementById("goEmoji");
  const statsEl = document.getElementById("goStats");

  if (outcome === "win") {
    titleEl.textContent = "VITÓRIA!"; titleEl.className = "go-title win";
    emojiEl.textContent = "🏆";
    statsEl.textContent = `Derrotaste ${opponentName}\nRonda final: ${finalRound}`;
  } else if (outcome === "lose") {
    titleEl.textContent = "ELIMINADO!"; titleEl.className = "go-title lose";
    emojiEl.textContent = "💀";
    statsEl.textContent = `${opponentName} venceu\nRonda final: ${finalRound}`;
  } else {
    titleEl.textContent = "EMPATE!"; titleEl.className = "go-title draw";
    emojiEl.textContent = "🤝";
    statsEl.textContent = `Ambos caíram na ronda ${finalRound}`;
  }

  document.getElementById("rematchBtn").textContent = "🔄 REVANCHE";
  document.getElementById("rematchBtn").onclick = requestRematch;
  showScreen("screen-gameover");
}

function requestRematch() {
  if (!ws || rematchRequested) return;
  rematchRequested = true;
  ws.send(JSON.stringify({ type: "requestRematch" }));
  showNotif("Pedido de revanche enviado!", "blue");
  document.getElementById("rematchBtn").textContent = "⏳ A aguardar...";
  document.getElementById("rematchBtn").disabled = true;
}

function acceptRematch() {
  if (!ws) return;
  ws.send(JSON.stringify({ type: "acceptRematch" }));
}

// ══════════════════════════════════════════════════════
// HUD
// ══════════════════════════════════════════════════════
function updateHUD() {
  document.getElementById("hud-round").textContent = currentRound;
  renderHearts("myHearts",    myHP,    myMaxHP);
  renderHearts("enemyHearts", enemyHP, enemyMaxHP);
  renderBullets("myBullets",    myBullets,    myMaxBullets);
  renderBullets("enemyBullets", enemyBullets, enemyMaxBullets);
}

function renderHearts(id, cur, max) {
  const el = document.getElementById(id); el.innerHTML = "";
  for (let i = 0; i < max; i++) {
    const h = document.createElement("span");
    h.className = "heart" + (i >= cur ? " lost" : "");
    h.textContent = i < cur ? "❤️" : "🖤";
    el.appendChild(h);
  }
}

function renderBullets(id, cur, max) {
  const el = document.getElementById(id); el.innerHTML = "";
  for (let i = 0; i < max; i++) {
    const b = document.createElement("span");
    b.className = "bullet-pip" + (i >= cur ? " empty" : "");
    el.appendChild(b);
  }
}

function setResultBanner(txt) { document.getElementById("resultBanner").textContent = txt; }

function updateActionBtns() {
  const isR1 = currentRound === 1;
  const canShoot  = myBullets > 0 && !isR1;
  const canReload = myBullets < myMaxBullets;
  document.getElementById("btn-reload").disabled = !canReload;
  document.getElementById("btn-defend").disabled = false;
  document.getElementById("btn-shoot").disabled  = !canShoot;
  document.getElementById("btn-reload").classList.remove("chosen");
  document.getElementById("btn-defend").classList.remove("chosen");
  document.getElementById("btn-shoot").classList.remove("chosen");
  const info = isR1
    ? "Ronda 1 — só podes recarregar ou defender!"
    : `Balas: ${myBullets}/${myMaxBullets}  |  Adversário: ${enemyBullets} balas`;
  document.getElementById("roundInfo").textContent = info;
}

function disableActionBtns() {
  document.getElementById("btn-reload").disabled = true;
  document.getElementById("btn-defend").disabled = true;
  document.getElementById("btn-shoot").disabled  = true;
}

// ══════════════════════════════════════════════════════
// WAITING ROOM
// ══════════════════════════════════════════════════════
function renderWaitingPlayers(count) {
  const list = document.getElementById("playersList");
  list.innerHTML = "";
  // Slot 1 — sempre preenchido (sou eu)
  const s1 = document.createElement("div");
  s1.className = "player-slot connected";
  s1.innerHTML = `<span class="slot-icon">🕴🏼</span><span class="slot-name">${myName}</span><span class="slot-status">✅ LIGADO</span>`;
  list.appendChild(s1);
  // Slot 2 — adversário
  const s2 = document.createElement("div");
  s2.className = "player-slot" + (count >= 2 ? " connected" : " waiting");
  s2.innerHTML = count >= 2
    ? `<span class="slot-icon">🕴🏻</span><span class="slot-name">${enemyNameStr || "ADVERSÁRIO"}</span><span class="slot-status">✅ LIGADO</span>`
    : `<span class="slot-icon">👤</span><span class="slot-name">A aguardar...</span><span class="slot-status waiting-dot">...</span>`;
  list.appendChild(s2);
}

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showNotif(msg, type = "") {
  const n = document.getElementById("notif");
  n.textContent = msg; n.className = "notif show" + (type ? " " + type : "");
  clearTimeout(n._t); n._t = setTimeout(() => { n.className = "notif" + (type ? " " + type : ""); }, 2500);
}

function confirmLeave() {
  if (confirm("Tens a certeza? Vais perder a batalha por W.O.")) leaveRoom();
}

function leaveRoom() {
  if (ws) { ws.close(); ws = null; }
  myId = null; chosenAction = null;
  showScreen("screen-lobby");
}
</script>
</body>
</html>
